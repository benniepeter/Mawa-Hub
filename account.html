<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="MawaHub ID account portal"><title>MawaHub ID | MawaHub</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="assets/styles.css"></head><body><header class="nav"><div class="navin"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="MawaHub"><span data-i18n="brand">MawaHub</span></a><div class="actions"><select data-language-selector aria-label="Language"></select><a class="ghost" href="marketplace.html" data-i18n="marketplace">Marketplace</a><a class="ghost" href="education.html">Education</a><a class="cta" href="payment-centre.html" data-i18n="donate">Donate</a></div></div></header><section class="pagehero"><div class="wrap"><span class="eyebrow">ONE ACCOUNT · MANY WAYS TO PARTICIPATE</span><h1>MawaHub ID</h1><p>One account for learning, buying, selling, volunteering, donating and partnerships.</p></div></section><main><section class="section"><div class="wrap"><div class="grid"><form class="card" id="loginForm"><span class="pill" data-i18n="login">Login</span><h2>Welcome back.</h2><label>Email</label><input id="loginId" type="email" required autocomplete="username"><label>Password</label><input id="loginPassword" type="password" required autocomplete="current-password"><button class="cta" id="loginButton" type="submit">Sign in</button><p id="loginMsg"></p></form><form class="card" id="registerForm"><span class="pill">CREATE ID</span><h2>Join MawaHub.</h2><label>Full name</label><input id="fullName" required autocomplete="name"><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Phone</label><input id="phone" type="tel" autocomplete="tel"><label>Country</label><select id="country"><option>Kenya</option><option>Tanzania</option><option>Other</option></select><label>Primary role</label><select id="role"><option>buyer</option><option>seller</option><option>donor</option><option>student</option><option>volunteer</option><option>partner</option></select><label>Password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><button class="cta" id="registerButton" type="submit">Create MawaHub ID</button><p id="registerMsg"></p></form></div></div></section></main><footer class="footer"><div class="wrap"><div class="brand inverse"><img src="assets/logo.svg" alt="MawaHub"> MawaHub</div><p>Mawazo Yanabadilisha Dunia · Ideas That Change the World</p></div></footer><script type="module">import {initLanguageSelector} from './assets/js/i18n.js';initLanguageSelector();const API_BASE=(window.MA WAHUB_API_BASE||'https://api.mawahub.org').replace(/\s+/g,'').replace(/\/$/,'');async function api(path,options={}){const response=await fetch(API_BASE+path,{...options,credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})}});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error||'Request failed');return data}function setBusy(button,busy){button.disabled=busy;button.setAttribute('aria-busy',String(busy))}loginForm.addEventListener('submit',async e=>{e.preventDefault();loginMsg.textContent='';setBusy(loginButton,true);try{await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify({email:loginId.value.trim(),password:loginPassword.value})});location.href='dashboard.html'}catch(error){loginMsg.textContent=error.message}finally{setBusy(loginButton,false)}});registerForm.addEventListener('submit',async e=>{e.preventDefault();registerMsg.textContent='';setBusy(registerButton,true);try{await api('/api/v1/auth/register',{method:'POST',body:JSON.stringify({email:email.value.trim(),phone:phone.value.trim()||undefined,fullName:fullName.value.trim(),country:country.value,role:role.value,password:password.value})});location.href='dashboard.html'}catch(error){registerMsg.textContent=error.message}finally{setBusy(registerButton,false)}});</script></body></html>
