<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MawaHub Transactions</title><link rel="stylesheet" href="assets/styles.css"></head><body><header class="nav"><div class="navin"><a class="brand" href="dashboard.html"><img src="assets/logo.svg" alt="MawaHub"><span>MawaHub</span></a><a class="cta" href="dashboard.html">Dashboard</a></div></header><main><section class="pagehero"><div class="wrap"><span class="eyebrow">MAWAHUB · TRANSACTIONS</span><h1>Your transactions</h1><p>Payments, orders and donations from your authenticated account.</p></div></section><section class="section"><div class="wrap"><div id="state" class="notice">Loading transactions…</div><div id="list" class="grid"></div></div></section></main><script type="module">const state=document.querySelector('#state'),list=document.querySelector('#list');function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}async function load(){const r=await fetch('/api/v1/transactions',{credentials:'include'});if(r.status===401){location.href='account.html';return;}if(!r.ok){state.textContent='Unable to load transactions.';return;}const d=await r.json();const rows=d.transactions||[];state.textContent=rows.length?`${rows.length} transaction(s)`: 'No transactions yet.';list.innerHTML=rows.map(x=>`<article class="card"><span class="pill">${esc(x.status)}</span><h2>${esc(x.currency)} ${(Number(x.amount_minor)/100).toFixed(2)}</h2><p>Provider: ${esc(x.provider)}</p><p>Reference: ${esc(x.provider_reference||'Pending')}</p><p>${esc(x.order_id?'Order: '+x.order_id:x.donation_id?'Donation: '+x.donation_id:'Payment')}</p><a class="ghost" href="receipt.html?id=${encodeURIComponent(x.id)}">View receipt</a></article>`).join('');}load().catch(()=>state.textContent='Unable to load transactions.');</script></body></html>
