<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MawaHub Receipt</title><link rel="stylesheet" href="assets/styles.css"></head><body><header class="nav"><div class="navin"><a class="brand" href="dashboard.html"><img src="assets/logo.svg" alt="MawaHub"><span>MawaHub</span></a><a class="cta" href="transactions.html">Transactions</a></div></header><main><section class="pagehero"><div class="wrap"><span class="eyebrow">MAWAHUB · RECEIPT</span><h1>Payment receipt</h1><p id="state">Loading receipt…</p></div></section><section class="section"><div class="wrap"><article id="receipt" class="card"></article></div></section></main><script type="module">const state=document.querySelector('#state'),box=document.querySelector('#receipt');const id=new URLSearchParams(location.search).get('id');function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}async function load(){if(!id){state.textContent='Missing transaction ID.';return;}const r=await fetch(`/api/v1/transactions/${encodeURIComponent(id)}/receipt`,{credentials:'include'});if(r.status===401){location.href='account.html';return;}if(!r.ok){state.textContent='Receipt not found.';return;}const {receipt:x}=await r.json();state.textContent='Official MawaHub transaction record';box.innerHTML=`<span class="pill">${esc(x.status)}</span><h2>${esc(x.receiptNumber)}</h2><p><strong>Payment:</strong> ${esc(x.paymentId)}</p><p><strong>Reference:</strong> ${esc(x.reference||'Pending')}</p><p><strong>Provider:</strong> ${esc(x.provider)}</p><p><strong>Amount:</strong> ${esc(x.currency)} ${(Number(x.amountMinor)/100).toFixed(2)}</p><p><strong>Order:</strong> ${esc(x.orderId||'—')}</p><p><strong>Donation:</strong> ${esc(x.donationId||'—')}</p><p><strong>Issued:</strong> ${esc(new Date(x.issuedAt).toLocaleString())}</p><button class="cta" onclick="window.print()">Print receipt</button>`;}load().catch(()=>state.textContent='Unable to load receipt.');</script></body></html>
